<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment2</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="parent">
        <div class="imag">
            <img src="images/1.png" alt="doctor">
        </div>
        <div class="container">
            <h1>Doctor Appointment Form</h1>
            <hr>
            <form>
                <div class="s">
                    <label>Appointment Date</label>
                    <input type="date" name="Appointment Date">
                </div>
                <br>
                <div class="s">
                    <label>Appointment Time</label>
                    <input type="time" name="Appointment Time">
                </div>
                <br>
                <label>Name</label>
                <input type="text" name="First" placeholder="First">
                <input type="text" name="Last" placeholder="Last">
                <br><br>
                <label>Gender</label>
                Male<input type="radio" name="gender">
                Female<input type="radio" name="gender">
                <br><br>
                <label>Phone</label>
                <input type="text" placeholder="####">
                <br><br>
                <label>Address</label>
                <input type="text" placeholder="city">
                <input type="text" placeholder="state">
                <br><br>
                <div class="s">
                    <label>Your Query</label>
                    <textarea name="query" rows="4" cols="35"></textarea>
                </div>
                <br>

                <div class="s">
                    <label>Appointment Type</label>
                    <div class="appointment">
                        <div>Select which appointment type(s) you require</div>

                        <input type="checkbox"> Cervix checkup <br>
                        <input type="checkbox"> Heart checkup <br>
                        <input type="checkbox"> Eye check-up <br>
                        <input type="checkbox"> Hearing Test <br>

                        <button type="submit">Send</button>
                    </div>
                </div>

            </form>
        </div>
    </div>
</body>

</html>
